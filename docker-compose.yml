services:
  db:
    image: postgres:16-alpine
    container_name: docuq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: document_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docuq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuq_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/document_intelligence
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/document_intelligence
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=docuq_prod_secret_key_8f9e0a1b2c3d4e5f
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - docuq_uploads:/app/backend/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuq_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/document_intelligence
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/document_intelligence
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=docuq_prod_secret_key_8f9e0a1b2c3d4e5f
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - docuq_uploads:/app/backend/uploads

volumes:
  postgres_data:
  docuq_uploads:
